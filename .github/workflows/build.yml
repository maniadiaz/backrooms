name: Build and verify Backrooms
on:
  push:
    branches: [main]
    tags: ['etapa-*', 'v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew build runGameTestServer --console=plain
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-delivery
          path: |
            build/libs/*.jar
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gametest-logs
          path: run-gametest/logs/
