plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'io.github.maniadiaz.bedroom'
version = mod_version
base { archivesName = 'bedroom' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { bedroom { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'bedroom' }
    }
}

dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
