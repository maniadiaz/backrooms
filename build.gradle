plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'io.github.maniadiaz.bedroom'
version = mod_version
base { archivesName = 'bedroom' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { bedroom { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', 'bedroom'
        }
    }
}

dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }

// Integration fixtures must not reuse chunks made by an older generator.
def gameTestWorld = layout.projectDirectory.dir('run-gametest/world').asFile
def cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    doFirst {
        if (!gameTestWorld.canonicalFile.toPath().startsWith(projectDir.canonicalFile.toPath())) {
            throw new GradleException('GameTest world must stay inside the project')
        }
    }
    delete gameTestWorld
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn cleanGameTestWorld }
